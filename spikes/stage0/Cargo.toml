# Stage 0 spike: its own workspace (not part of the main Cargo workspace).
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Size matters on devnet: every KB of .so locks ~0.007 SOL of rent (x2 during an upgrade).
opt-level = "z"

# The hot path (the sim) stays at full speed.
[profile.release.package.lil-dudes-sim]
opt-level = 3

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
