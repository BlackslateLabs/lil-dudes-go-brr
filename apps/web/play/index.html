<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1530" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/brand/logo.webp" as="image" type="image/webp" />
    <!-- Self-hosted fonts (OFL): canvas labels need Lilita One before the first frame. -->
    <link rel="preload" href="/fonts/LilitaOne-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Baloo2-Latin-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fx/particles.webp" as="image" type="image/webp" />
    <!-- The arena's models and walk cycles download alongside the code, not after it (fetch mode
         and credentials match the loaders', so the browser reuses these). -->
    <link rel="preload" href="/assets/models/nature.glb" as="fetch" crossorigin />
    <link rel="preload" href="/assets/models/hall.glb" as="fetch" crossorigin />
    <link rel="preload" href="/assets/models/towers.glb" as="fetch" crossorigin />
    <link rel="preload" href="/assets/models/blaster.glb" as="fetch" crossorigin />
    <link rel="preload" href="/assets/models/dudes.glb" as="fetch" crossorigin />
    <link rel="preload" href="/assets/models/dudes-anim.bin" as="fetch" crossorigin />
    <title>Lil Dudes Go Brr</title>
    <meta name="description" content="Live 1v1 crowd-cannon duels with hidden gates and real stakes on Solana." />
    <!-- Link previews (absolute: some sites need it). -->
    <meta property="og:title" content="Lil Dudes Go Brr" />
    <meta property="og:description" content="Live 1v1 crowd-cannon duels with hidden gates and real stakes on Solana." />
    <meta property="og:image" content="https://ldgb.blackslate.me/brand/og.png" />
    <meta property="og:url" content="https://ldgb.blackslate.me/play/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Lil Dudes Go Brr needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
