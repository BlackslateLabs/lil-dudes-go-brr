# Render Blueprint for apps/server (not applied by anyone yet; see docs/TECH.md §9 "Deploy").
# Secrets are set in the Render dashboard (sync: false), never here.
services:
  - type: web
    name: lil-dudes-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    # Free plan. A free instance sleeps after 15 min idle (the bot and the sweeper stop; the first
    # request waits ~1 min). An uptime pinger on /healthz every 5-10 min keeps it awake (750 free
    # hours a month covers one always-on service). Set the pinger up before judging starts.
    plan: free
    numInstances: 1
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: BASE_RPC_URL
        value: https://rpc.magicblock.app/devnet
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: SPONSOR_SECRET_KEY
        sync: false
      - key: BOT_SECRET_KEY
        sync: false
      # Match history (profile page). Needs the disk below, which free instances don't have, so
      # HISTORY_FILE stays unset and history lives in memory until the next restart.
      # - key: HISTORY_FILE
      #   value: /data/history.jsonl
    # disk:
    #   name: lil-dudes-data
    #   mountPath: /data
    #   sizeGB: 1
