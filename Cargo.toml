[workspace]
members = ["programs/*", "crates/*"]
# MagicSVM tests have their own [workspace] (like MagicBlock's examples).
exclude = ["tests-magicsvm"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

# The sim's tests play thousands of full matches; optimise it in dev/test builds too.
# Overflow checks and debug assertions stay on (they are dev-profile settings, not opt-level).
[profile.dev.package.lil-dudes-sim]
opt-level = 2

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
