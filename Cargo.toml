[workspace]
members = ["programs/*", "crates/*"]
# MagicSVM tests have their own [workspace] (like MagicBlock's examples).
exclude = ["tests-magicsvm"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
